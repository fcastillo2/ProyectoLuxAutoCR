<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Administración | LuxAuto</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="/styles.css"
    >

</head>


<body>

    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-12 col-md-8 col-lg-5">

                <div class="card shadow">

                    <div class="card-body p-4">

                        <h1 class="h3 text-center mb-4">
                            Administración LuxAuto
                        </h1>


                        <div class="mb-3">

                            <label
                                for="claveAdmin"
                                class="form-label"
                            >
                                Clave administrativa
                            </label>

                            <input
                                type="password"
                                id="claveAdmin"
                                class="form-control"
                                autocomplete="current-password"
                            >

                        </div>


                        <button
                            type="button"
                            id="btnDescargar"
                            class="btn btn-primary w-100"
                        >
                            Descargar reservas
                        </button>


                        <div
                            id="mensajeAdmin"
                            class="mt-3"
                            role="alert"
                            aria-live="polite"
                        ></div>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <script src="/admin.js"></script>

</body>

</html>
