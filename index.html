<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LuxAutoCR</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="encabezado text-center py-5">

        <div class="container">

            <img src="img/logo.png" alt="LuxAuto Faros" class="img-fluid logo-luxauto">

            <p class="descripcion mt-3">
                Reserva tu espacio para el servicio de tu vehículo
                de manera rápida y sencilla.
            </p>

        </div>

    </header>


    <main class="container pb-5">

        <section class="formulario-reserva mx-auto p-4 p-md-5">

            <h2 class="titulo-dorado text-center mb-2">
                Realizar reserva
            </h2>

            <p class="text-secondary text-center mb-4">
                Selecciona la fecha y hora para tu vehículo.
            </p>

            <form id="formReserva">

                <div class="mb-3">

                    <label for="nombre" class="form-label">
                        Nombre
                    </label>

                    <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ingrese su nombre"
                        required>

                </div>


                <div class="mb-3">

                    <label for="vehiculo" class="form-label">
                        Tipo de carro
                    </label>

                    <input type="text" class="form-control" id="vehiculo" name="vehiculo"
                        placeholder="Ejemplo: Toyota Corolla" required>

                </div>


                <div class="row">

                    <!-- Fecha -->
                    <div class="col-12 col-md-6 mb-3">

                        <label for="fecha" class="form-label">
                            Fecha
                        </label>

                        <input type="date" class="form-control" id="fecha" name="fecha" required>

                    </div>

                    <div class="col-12 col-md-6 mb-3">

                        <label for="hora" class="form-label">
                            Hora
                        </label>

                        <select class="form-select" id="hora" name="hora" required>

                            <option value="" selected disabled>
                                Seleccione una hora
                            </option>

                            <option value="16:30">4:30 p. m.</option>
                            <option value="17:00">5:00 p. m.</option>

                            <option value="17:30">5:30 p. m.</option>
                            <option value="18:00">6:00 p. m.</option>

                            <option value="18:30">6:30 p. m.</option>
                            <option value="19:00">7:00 p. m.</option>

                            <option value="19:30">7:30 p. m.</option>
                            <option value="20:00">8:00 p. m.</option>

                            <option value="20:30">8:30 p. m.</option>
                            <option value="21:00">9:00 p. m.</option>

                            <option value="21:30">9:30 p. m.</option>
                            <option value="22:00">10:00 p. m.</option>

                        </select>

                    </div>

                </div>


                <div class="d-grid mt-3">

                    <button type="submit" id="btnReservar" class="btn btn-luxauto btn-lg">

                        Realizar reserva

                    </button>

                </div>

            </form>



            <div id="mensajeReserva" class="mensaje-reserva mt-4" role="alert" aria-live="polite">


            </div>

        </section>

    </main>


    <script src="reservas.js"></script>

</body>

</html>
