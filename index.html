<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LuxAutoCR</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="encabezado text-center py-5">

        <div class="container">

            <img src="img/logo.jpg" alt="LuxAuto Faros" class="img-fluid logo-luxauto">

            <p class="descripcion mt-3">
                Reserva tu espacio para el servicio de tu vehículo
                de manera rápida y sencilla.
            </p>

        </div>

    </header>


    <section id="galeria" class="py-5">

        <div class="container">

            <div class="galeria-luxauto p-4 p-md-5">

                <div class="text-center mb-5">

                    <h2 class="titulo-dorado">Nuestros trabajos</h2>

                    <p class="texto-plateado">
                        Conoce algunos de los trabajos realizados por LuxAutoCR.
                    </p>

                </div>


                <!-- FOTOGRAFÍAS -->
                <div class="row g-4">

                    <div class="col-12 col-md-6 col-lg-4">
                        <img src="/img/galeria/FotoTrabajo1.jpeg" class="img-fluid rounded shadow-sm imagen-galeria"
                            alt="Trabajo realizado por LuxAutoCR">
                    </div>


                    <div class="col-12 col-md-6 col-lg-4">
                        <img src="/img/galeria/FotoTrabajo2.jpeg" class="img-fluid rounded shadow-sm imagen-galeria"
                            alt="Trabajo realizado por LuxAutoCR">
                    </div>


                    <div class="col-12 col-md-6 col-lg-4">
                        <img src="/img/galeria/FotoTrabajo3.jpeg" class="img-fluid rounded shadow-sm imagen-galeria"
                            alt="Trabajo realizado por LuxAutoCR">
                    </div>


                    <div class="col-12 col-md-6 col-lg-4">
                        <img src="/img/galeria/FotoTrabajo4.jpeg" class="img-fluid rounded shadow-sm imagen-galeria"
                            alt="Trabajo realizado por LuxAutoCR">
                    </div>


                    <div class="col-12 col-md-6 col-lg-4">
                        <img src="/img/galeria/FotoTrabajo5.jpeg" class="img-fluid rounded shadow-sm imagen-galeria"
                            alt="Trabajo realizado por LuxAutoCR">
                    </div>

                    <div class="col-12 col-md-6 col-lg-4">
                        <img src="/img/galeria/FotoTrabajo6.jpeg" class="img-fluid rounded shadow-sm imagen-galeria"
                            alt="Trabajo realizado por LuxAutoCR">
                    </div>

                </div>


                <!-- VIDEOS -->
                <div class="row g-4 mt-4">

                    <div class="col-12 col-lg-6">

                        <video class="w-100 rounded shadow-sm video-galeria" controls preload="metadata">

                            <source src="/img/videos/VideoTrabajo1.mp4" type="video/mp4">

                            Tu navegador no puede reproducir este video.

                        </video>

                    </div>


                    <div class="col-12 col-lg-6">

                        <video class="w-100 rounded shadow-sm video-galeria" controls preload="metadata">

                            <source src="/img/videos/VideoTrabajo2.mp4" type="video/mp4">

                            Tu navegador no puede reproducir este video.

                        </video>

                    </div>

                </div>

            </div>
        </div>

    </section>


    <main class="container pb-5">

        <section class="formulario-reserva mx-auto p-4 p-md-5">

            <h2 class="titulo-dorado text-center mb-2">
                Realizar reserva
            </h2>

            <p class="texto-plateado text-center mb-4">
                Selecciona la fecha y hora para tu vehículo.
            </p>

            <form id="formReserva">

                <div class="mb-3">

                    <label for="nombre" class="form-label">
                        Nombre
                    </label>

                    <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ingrese su nombre"
                        required>

                </div>


                <div class="mb-3">

                    <label for="vehiculo" class="form-label">
                        Tipo de carro
                    </label>

                    <input type="text" class="form-control" id="vehiculo" name="vehiculo"
                        placeholder="Ejemplo: Toyota Corolla" required>

                </div>


                <div class="row">

                    <!-- Fecha -->
                    <div class="col-12 col-md-6 mb-3">

                        <label for="fecha" class="form-label">
                            Fecha
                        </label>

                        <input type="date" class="form-control" id="fecha" name="fecha" required>

                    </div>

                    <div class="col-12 col-md-6 mb-3">

                        <label for="hora" class="form-label">
                            Hora
                        </label>

                        <select class="form-select" id="hora" name="hora" required>

                            <option value="" selected disabled>
                                Seleccione una fecha primero
                            </option>

                        </select>

                    </div>

                </div>


                <div class="d-grid mt-3">

                    <button type="submit" id="btnReservar" class="btn btn-luxauto btn-lg">

                        Realizar reserva

                    </button>

                </div>

            </form>



            <div id="mensajeReserva" class="mensaje-reserva mt-4" role="alert" aria-live="polite">


            </div>

        </section>

    </main>


    <script src="reservas.js"></script>

</body>

</html>
